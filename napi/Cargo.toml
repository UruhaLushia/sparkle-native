[package]
name = "sparkle-native-napi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Sparkle native bridge bindings"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
sparkle-native = { path = ".." }

[build-dependencies]
napi-build = "2"
